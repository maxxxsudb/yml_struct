statements = [
      // 1. Помечаем логи, содержащие нужную маркировку
      `set(attributes["is_crf_nifi_log"], true) where IsMatch(body, ".*CRF-NIFI-PROV-SECLOG.*")`,

      // 2. Удаляем префикс вида [CRF-NIFI-PROV-SECLOG-91] только для помеченных логов
      `replace_pattern(body, "^\\[CRF-NIFI-PROV-SECLOG.*?\\]\\s*", "") where attributes["is_crf_nifi_log"] == true`,

      // 3. Парсим JSON в тело лога только для помеченных
      `set(body, ParseJSON(body)) where attributes["is_crf_nifi_log"] == true`,

      // 4. Извлекаем поля в атрибуты только для помеченных
      `set(attributes["method"], body["METHOD"]) where attributes["is_crf_nifi_log"] == true and body["METHOD"] != nil`,
      `set(attributes["username"], body["USERNAME"]) where attributes["is_crf_nifi_log"] == true and body["USERNAME"] != nil`,
      `set(attributes["path"], body["PATH"]) where attributes["is_crf_nifi_log"] == true and body["PATH"] != nil`,
      `set(attributes["client_ip"], body["CLIENT_IP"]) where attributes["is_crf_nifi_log"] == true and body["CLIENT_IP"] != nil`,
      `set(attributes["event_id"], body["eventId"]) where attributes["is_crf_nifi_log"] == true and body["eventId"] != nil`,
      `set(attributes["event_type"], body["eventType"]) where attributes["is_crf_nifi_log"] == true and body["eventType"] != nil`,
      `set(attributes["component_name"], body["componentName"]) where attributes["is_crf_nifi_log"] == true and body["componentName"] != nil`,
    ]

otelcol.processor.attributes "nifi_parser" {
  // Извлекаем имя пользователя
  action {
    action = "extract"
    key    = "body"
    pattern = `.*"USERNAME":"(?P<Username>[^"]+)".*`
  }
  // Извлекаем IP клиента
  action {
    action = "extract"
    key    = "body"
    pattern = `.*"CLIENT_IP":"(?P<ClientIP>[^"]+)".*`
  }
  // Извлекаем тип события (например, SEND)
  action {
    action = "extract"
    key    = "body"
    pattern = `.*"eventType":"(?P<EventType>[^"]+)".*`
  }
  // Извлекаем имя компонента (например, [TGT] Записать в БД...)
  action {
    action = "extract"
    key    = "body"
    pattern = `.*"componentName":"(?P<ComponentName>[^"]+)".*`
  }
  
  output {
    logs = [otelcol.processor.transform.nifi_cef.input]
  }
}
------
otelcol.processor.transform "nifi_cef" {
  error_mode = "ignore"
  log_statements {
    context = "log"
    statements = [
      // 1. Формируем заголовок CEF
      `set(cache["cefHead"], "CEF:0|NiFi|NiFi|1.0")`,
      
      `set(cache["eventClassId"], "UnknownEvent")`,
      `set(cache["eventClassId"], attributes["EventType"]) where attributes["EventType"] != nil`,
      
      `set(cache["name"], "NiFi_Action")`,
      `set(cache["name"], attributes["ComponentName"]) where attributes["ComponentName"] != nil`,
      
      `set(cache["severity"], "1")`,
      
      // Склеиваем заголовок через пайп
      `set(cache["cefEvent"], Concat([cache["cefHead"], cache["eventClassId"], cache["name"], cache["severity"]], "|"))`,
      
      // 2. Формируем Extension (Key-Value) — здесь вторым аргументом передаем пустую строку ""
      `set(cache["kv_rt"], Concat(["rt=", UnixSeconds(time)], ""))`,
      
      `set(cache["kv_suser"], "")`,
      `set(cache["kv_suser"], Concat(["suser=", attributes["Username"]], "")) where attributes["Username"] != nil`,
      
      `set(cache["kv_shost"], "")`,
      `set(cache["kv_shost"], Concat(["shost=", attributes["ClientIP"]], "")) where attributes["ClientIP"] != nil`,
      
      // 3. Собираем Extension в одну строку через пробел
      `set(cache["cefExtension"], Concat([cache["kv_rt"], cache["kv_suser"], cache["kv_shost"]], " "))`,
      
      // 4. Итоговое сообщение для syslog (соединяем заголовок и расширение через пайп)
      `set(attributes["message"], Concat([cache["cefEvent"], cache["cefExtension"]], "|"))`
    ]
  }
  output {
    logs = [
      otelcol.exporter.debug.default.input,
      otelcol.exporter.syslog.arcsight_debug.input
    ]
  }
}
